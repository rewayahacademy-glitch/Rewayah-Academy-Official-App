name: CI

on:
  # `ui/**` depuis le 09/10/2026 (decision D2, CI-D2) : les PR des postes vers
  # leur branche `ui/*` n'etaient jamais controlees. GitHub lit ce fichier sur
  # la branche de BASE : il ne sert a une branche `ui/*` qu'une fois present
  # dans cette branche.
  pull_request:
    branches: [main, 'ccr-1b1bfa0b-m1kvkk', 'ui/**']
  workflow_dispatch:

# Deux poussees rapprochees : la premiere CI est annulee (economie de minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-check:
    name: Migrations applicables (Postgres 17)
    # Le SQL et les fonctions Edge ne sont controles que vers `main` : les
    # branches `ui/*` ne touchent pas `supabase/`.
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || github.base_ref == 'ccr-1b1bfa0b-m1kvkk'
    runs-on: ubuntu-latest
    container: postgres:17-alpine
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Stub les roles et les fonctions Supabase, puis applique les migrations
        shell: bash
        run: |
          # auth.uid() et auth.jwt() font partie du stub : Postgres valide le
          # corps des fonctions SQL a leur creation, donc 0001 ne s'applique pas
          # sans elles. Leur absence faisait echouer ce job des la premiere
          # migration.
          #
          # Le stub est versionne plutot qu'ecrit ici : les scenarios ci-dessous
          # ont besoin de pouvoir se faire passer pour un appelant donne, et un
          # stub qui differe entre la CI et le poste ne prouve rien.
          psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/stub_auth.sql
          for f in supabase/migrations/*.sql; do
            echo "--- $f"
            psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f "$f"
          done

      # Inscription bornee a deux roles, depot KYC de l'enseignant, cloisonnement
      # de genre, appareil partage, plafond d'appareils, codes d'appairage,
      # immuabilite des signatures, etancheite du journal d'audit, RLS partout,
      # search_path partout. Voir docs/archive/2026-09-pre-remise-a-plat/architecture/etape-3-auth-kyc.md section 8.
      - name: Scenarios d'acceptation SQL des etapes 1 et 3
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_etape3.sql

      # C-21 : verdict minimal d'acces KYC calcule en base, sans exposer le
      # genre ou les metadonnees du dossier a l'adaptateur client.
      - name: Scenario SQL du verdict KYC C-21
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_c21_kyc_access_verdict.sql

      # Disponibilites communes aux deux roles, affectation durable et son
      # plafond, regles par eleve et leur immuabilite, chevauchement de seances,
      # cloisonnement des disponibilites, demandes des quatre parties, feed de
      # matching a cheval sur deux fuseaux, compteurs de ADM-01.
      # Voir docs/archive/2026-09-pre-remise-a-plat/architecture/etape-4-dashboards.md section 7.
      - name: Scenarios d'acceptation SQL de l'etape 4
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_etape4.sql

      # Coran structure, position de lecture personnelle, machine a etats de
      # presence a quatorze etats et sa derivation.
      # Voir docs/archive/2026-09-pre-remise-a-plat/architecture/etape-5-salle-coran-presence.md section 6.
      #
      # Ce fichier existait depuis le lot N1 et n'avait jamais ete ajoute ici :
      # ses quinze controles n'ont ete rejoues que sur le poste, jamais par la
      # CI, jusqu'au 12 septembre 2026.
      - name: Scenarios d'acceptation SQL de l'etape 5
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_etape5.sql

      # Attribution manuelle : file des eleves sans enseignant, croisement des
      # creneaux par instant, motif obligatoire hors disponibilite (ADR-021),
      # plafond, et le mur d'ecriture de 0005 qui doit tenir apres 0008.
      #
      # Ses assertions sont bornees a ses propres fixtures precisement pour
      # tenir a la suite des trois autres sur la meme base.
      - name: Scenarios d'acceptation SQL de ADM-05
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_adm05.sql

      # Video : aiguillage a deux fournisseurs ancre par seance, emission de
      # jeton, capacites deduites du role, webhooks idempotents, et l'etat
      # `en_connexion` que N1 refusait de deviner faute de trace en base.
      # Voir docs/archive/2026-09-pre-remise-a-plat/architecture/decisions.md, ADR-001 et ADR-023.
      - name: Scenarios d'acceptation SQL de N2 (video)
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_n2.sql

      # Presence : ce que `presence_seance_v` montre a chacun, et surtout ce
      # qu'elle refuse de montrer. Le calcul des quatorze etats se mesure plus
      # haut (etape 5, puis N2) ; ici c'est la BORNE -- l'eleve n'y lit que sa
      # ligne, un tiers n'y lit rien, et une visite de controle n'y laisse
      # aucune trace lisible (ADR-011).
      - name: Scenarios d'acceptation SQL de N4 (presence)
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_n4.sql

      # Coran : ce que le corpus importe par 0013 contient reellement, et a qui
      # la position de lecture appartient. Les comptages (114, 30, 604, 6236)
      # sont deja tenus par la migration elle-meme ; ce qu'ils ne peuvent pas
      # tenir et qui est ici, c'est la PAGINATION -- quatre reperes verifiables
      # sur un exemplaire imprime, sans lesquels un corpus complet mais pagine
      # au hasard passerait tous les comptages sans rien signaler.
      #
      # Et surtout J2 : aucune policy n'autorise un enseignant a ecrire la
      # position de lecture d'un eleve. C'est pour cela que
      # `student_reading_position` existe separement de tout etat de seance.
      - name: Scenarios d'acceptation SQL de N5 (Coran)
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_n5.sql

      # Controle qualite : la porte d'observation de `CTR-01`, et les quatre
      # surfaces ou l'invisibilite de l'ADR-011 n'existait pas avant 0012.
      # `C1` est le controle du lot : un cours 1-to-1 est plein au sens du
      # plafond du MVP-0, et aucune visite n'y etait donc possible -- c'est-a-dire
      # aucune visite nulle part. Les fixtures de ce fichier ne levent PAS
      # `allow_multi_participant_sessions`, volontairement : c'est l'etat normal
      # du produit qu'il faut mesurer.
      - name: Scenarios d'acceptation SQL de CTR-01 (observation)
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_ctr01.sql

      # Acces des agents IA : ce que le jeton d'observation ouvre, ce qu'il
      # refuse, et de qui. `A6` est le controle du lot -- l'agent ne peut RIEN
      # ecrire, et c'est le moteur qui le refuse, pas l'interface. `A8` mesure
      # que le masquage des prenoms est DUR (substitue dans les vues) et non un
      # rendu, `A11` que la revocation mord a la requete suivante, et `A13` que
      # les huit vues reecrites par 0014 n'ont rien coute a une session humaine.
      #
      # Comme `CTR-01`, il doit rester AVANT `ADM-04` : l'emission et la remise
      # d'un jeton ecrivent dans `audit_logs`, et `J4` relit la chaine entiere.
      - name: Scenarios d'acceptation SQL de AGT-01 (acces agent)
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_agt01.sql

      # Hook de jeton d'acces : la chaine entiere, du hook jusqu'a l'insertion
      # reelle. C'est le SEUL niveau auquel le defaut du 21 septembre 2026 etait
      # visible -- le hook rendait NULL pour tout profil sans foyer, Auth emettait
      # alors un jeton sans revendication, et `app_role()` fermait toutes les
      # policies en silence. Quatre enseignants sont restes bloques neuf jours,
      # alors que le seau, la policy et le declencheur etaient tous corrects pris
      # separement. Corrige par 0038.
      #
      # `profiles_household_required` (0004) autorise un foyer NULL pour quatre
      # roles -- admin, accountant, controller, teacher : H2 les couvre, parce
      # que mesurer le seul enseignant laisserait croire a un cas particulier.
      #
      # Doit rester APRES scenarios_etape3, dont le controle ADM-02 compte les
      # dossiers en attente de toute la base : H8 en cree un.
      - name: Scenarios d'acceptation SQL du hook de jeton
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_hook_jeton.sql

      # Stockage R2 : la PORTE des quatre seaux. Qui obtient le droit de faire
      # signer une URL, et surtout qui ne l'obtient pas -- anonyme, role non
      # autorise, cloisonnement de genre jusque dans l'ouverture d'UNE piece,
      # relation a la seance pour une archive, archive expiree ou revoquee.
      # Plus le gel de conservation exige par l'ADR-002, sans lequel une purge
      # a trente jours effacerait une piece sous litige.
      #
      # Le routage des quatre domaines vers leurs quatre seaux et la forme des
      # URL signees ne se mesurent pas ici mais en Deno
      # (supabase/functions/_shared/r2/*_test.ts) : ils ne touchent pas la base.
      # Aucun de ces controles n'appelle Cloudflare.
      #
      # Comme CTR-01 et AGT-01, il doit rester AVANT ADM-04 : chacune de ces
      # portes ecrit dans audit_logs, et J4 relit la chaine entiere.
      - name: Scenarios d'acceptation SQL du stockage R2
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_r2.sql

      - name: Scenario SQL C-35 lecture de bibliotheque
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_c35_library_read.sql

      # Journal d'audit : lecture reservee a l'administration, pagination par
      # keyset, trois filtres, et surtout la chaine de hachage de 0001 enfin
      # verifiee -- y compris en la falsifiant volontairement (J5, J6).
      #
      # Il vient en DERNIER, et c'est structurel : J4 verifie l'integrite de
      # tout ce que les six fichiers precedents ont ecrit dans `audit_logs`.
      # Le remonter dans la liste ne mesurerait plus que ses propres fixtures.
      - name: Scenarios d'acceptation SQL de ADM-04
        shell: bash
        run: psql -h postgres -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/scenarios_adm04.sql

      # Revue B-18 (VALID-I7 / Q3) : droits ACL et refus des RPC protégées
      # sous anon, authenticated sans claims et agent_ro. Vérifié sur base jetable.
      - name: Scenarios négatifs B-18 (SECURITY DEFINER)
