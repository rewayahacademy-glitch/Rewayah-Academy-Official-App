  edge-r2:
    name: Fonctions Edge -- stockage R2 (Deno)
    if: github.event_name != 'pull_request' || github.base_ref == 'main' || github.base_ref == 'ccr-1b1bfa0b-m1kvkk'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Premier job Deno du depot. Avant lui, rien ne verifiait supabase/functions :
      # le TypeScript des fonctions Edge n'etait ni compile ni teste par la CI.
      #
      # Ce que ces tests prouvent, et que la connectivite deja mesuree ne dit
      # pas : chaque responsabilite metier atteint SON seau et aucun autre, un
      # secret absent echoue sans exposer sa valeur, il n'existe aucun repli
      # silencieux d'un domaine vers un autre, une cle d'objet ne porte aucune
      # donnee lisible, et une URL signee est bornee en duree comme en methode.
      # Aucun appel reseau vers Cloudflare : aws4fetch signe localement.
      - name: Tests du stockage R2
        run: deno test supabase/functions/_shared/r2/

      # MINEUR-FANTOME (07/11/2026) : creer-profil-enfant refuse 18 ans et plus
      # et un genre hors de public.gender, tolere son absence, et ne pose le
      # genre que dans app_metadata (demande.ts). Aucun appel reseau.
      - name: Tests de creer-profil-enfant
        run: deno test supabase/functions/creer-profil-enfant/

      # Le type-check s'arrete aux fichiers R2. `livekit-webhook` en est exclu
      # volontairement : il importe `_shared/livekit.ts`, dont la ligne 104
      # porte une erreur de type anterieure a ce lot (`canPublishSources`,
      # introduite par e76a14e le 12 septembre). La corriger n'appartient pas
      # au perimetre du stockage.
      - name: Type-check des points d'entree R2
        run: |
          deno check \
            supabase/functions/_shared/r2/ \
            supabase/functions/piece-identite-acces/index.ts \
            supabase/functions/piece-identite-depot/index.ts \
            supabase/functions/piece-identite-confirme/index.ts \
            supabase/functions/archive-seance-acces/index.ts

      # Aucune valeur de secret ne doit exister dans le depot. Les NOMS des
      # variables R2 ont le droit d'y etre, et y sont ; leurs valeurs jamais.
      #
      # Quatre gardes, de la plus ciblee a la plus large.
      #
      # La premiere est celle qui vise juste : un NOM de secret R2 suivi d'une
      # valeur. C'est la forme exacte qu'aurait un trousseau colle par
      # inadvertance, et elle porte sur tout le depot, documentation et tests
      # compris. Chercher partout une simple chaine de 64 hexadecimaux ne
      # marcherait pas : le depot en contient legitimement, ce sont les
      # empreintes SHA-256 des fixtures du Teaching Core.
      - name: Aucun secret R2 versionne
        shell: bash
        run: |
          if git grep -nIE 'R2_[A-Z_]+ *[=:] *.{0,2}[0-9a-fA-F]{16}' ; then
            echo "Un nom de secret R2 est suivi de ce qui ressemble a sa valeur."
            echo "Les NOMS des variables R2 sont autorises ; leurs VALEURS jamais."
            exit 1
          fi
          if git grep -nIE '\b[0-9a-f]{32}\.(eu\.)?r2\.cloudflarestorage\.com' ; then
            echo "Un point d acces R2 reel est versionne."
            exit 1
          fi
          if git grep -nI 'r2\.cloudflarestorage\.com' -- lib supabase/migrations ; then
            echo "Un point d acces R2 n a rien a faire dans Flutter ni dans une migration."
            exit 1
          fi
          # Et sur le perimetre du lot, la garde large reste tenable : aucune
          # empreinte legitime n'y vit.
          if git grep -nIE '\b[0-9a-f]{64}\b' -- \
             supabase/functions supabase/migrations docs/architecture ; then
            echo "Une chaine de 64 caracteres hexadecimaux ressemble a un secret R2."
            exit 1
          fi

  # Tests Flutter en lots paralleles : quatre le 02/11/2026 (mesure du run
  # 41534073811 : `flutter test` prenait 46 min 40 s sur les 52 min du job),
  # six le 03/11/2026, equilibres par la taille des fichiers au lieu du
  # tourniquet (lots de 3,09 a 3,64 Mo avant, 2,19 Mo chacun apres).
  # Repartition PAR FICHIER : chaque lot ne
  # compile que ses fichiers. `--total-shards` ne convient pas ici : package:test
  # repartit les tests a l'interieur de chaque fichier, donc chaque lot
  # compilerait les 1 080 fichiers. Meme checkout qu'avant (un test lit git).
  flutter-tests:
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    name: Tests Flutter (lot ${{ matrix.lot }} sur 6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lot: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Tests Flutter du lot
        shell: bash
        run: |
          # Six lots equilibres par la taille des fichiers (le plus gros d'abord,
          # chacun au lot le moins charge) : meme partage sur tous les lots,
          # car l'ordre est fixe (taille, puis chemin, LC_ALL=C).
          mapfile -t fichiers < <(find test -name '*_test.dart' -printf '%s %p\n' | LC_ALL=C sort -k1,1nr -k2,2 | awk -v n=6 -v i=${{ matrix.lot }} '{ m = 0; for (j = 1; j < n; j++) if (c[j] < c[m]) m = j; c[m] += $1; if (m == i) print $2 }')
          echo "Lot ${{ matrix.lot }} : ${#fichiers[@]} fichiers"
          # Un lot vide ne doit jamais passer au vert en silence.
          test "${#fichiers[@]}" -gt 0
          flutter test "${fichiers[@]}"

  # « Flutter (web) » garde son nom : il ne passe au vert que si les six lots
  # de tests ET le build sont verts. `always()` : un job saute compterait comme
  # reussi dans une protection de branche ; celui-ci echoue a la place.
  # Captures R3 (directeur, 01/11/2026, DECISION-BRANCHEMENT-2026-11-01.md) :
  # pas de capture docs/current/captures/E2E/<lot>/, pas de fusion. Une PR vers
  # main qui change lib/ (hors code genere *.g.dart) doit ajouter ou modifier au
  # moins un fichier de captures. HEAD est le commit de fusion de la PR : son
  # premier parent est la base, d'ou fetch-depth 2.
  captures-r3:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    name: Captures R3 quand lib/ change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Une capture E2E accompagne tout changement de lib/
        shell: bash
        run: |
          changes="$(git diff --name-only HEAD^1 HEAD)"
          lib="$(printf '%s\n' "$changes" | grep -E '^lib/' | grep -vE '\.g\.dart$' || true)"
          captures="$(printf '%s\n' "$changes" | grep -E '^docs/current/captures/E2E/[^/]+/.+' || true)"
          if [ -z "$lib" ]; then
            echo "Aucun changement dans lib/ : rien a exiger."
            exit 0
          fi
          if [ -z "$captures" ]; then
            echo "Cette PR change lib/ sans aucune capture sous docs/current/captures/E2E/<lot>/ :"
            printf '%s\n' "$lib"
            echo "Regle R3 du directeur (01/11/2026) : pas de capture, pas de fusion."
            exit 1
          fi
          echo "Captures presentes :"
          printf '%s\n' "$captures"

  # « Flutter (web) » garde son nom : il ne passe au vert que si les six lots
  # de tests, le build (avec le branchement) ET, sur une PR, les captures R3
  # sont verts. `always()` : un job saute compterait comme reussi dans une
  # protection de branche ; celui-ci echoue a la place. Les captures ne sont
  # exigees que sur une PR : sautees ailleurs (Run workflow), elles passent.
  flutter:
    if: always() && (github.event_name != 'pull_request' || github.base_ref == 'main')
    needs: [flutter-tests, flutter-build, captures-r3]
    name: Flutter (web)
    runs-on: ubuntu-latest
    steps:
      - name: Tests, build, branchement et captures verts
        shell: bash
        run: |
          t="${{ needs.flutter-tests.result }}"; b="${{ needs.flutter-build.result }}"; c="${{ needs.captures-r3.result }}"
          echo "tests : $t ; build : $b ; captures : $c"
          [ "$t" = "success" ] && [ "$b" = "success" ] || exit 1
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            [ "$c" = "success" ]
          else
            [ "$c" = "success" ] || [ "$c" = "skipped" ]
          fi

  flutter-build:
    # Les PR backend vers ccr exécutent les migrations/scénarios et Edge; les builds Flutter restent sur les PR main et les lancements manuels.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    name: Flutter (build ${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        # Economie de minutes (directeur, 24/10/2026) : une PR ne construit que le Web ;
        # l'APK et Windows seulement par « Run workflow ».
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"ubuntu-latest","target":"web"}]' || '[{"os":"ubuntu-latest","target":"web"},{"os":"ubuntu-latest","target":"apk"},{"os":"windows-latest","target":"windows"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # Le code genere est versionne pour que `dart analyze` fonctionne sans
      # etape prealable. On le regenere quand meme, et un diff non vide signale
      # qu'un fichier source et son code genere ont diverge.
      - name: Regenere le code et refuse toute divergence
        shell: bash
        run: |
          dart run slang
          dart run build_runner build --delete-conflicting-outputs
          if [ -n "$(git status --porcelain)" ]; then
            echo "Le code genere ne correspond plus aux sources :"
            git status --porcelain
            git diff
            exit 1
          fi

      - run: dart analyze --fatal-infos

      # Jetons de couleur, echelle d'espacement, catalogue d'icones unique,
      # absence d'onTap nu, zero emoji, API de PermanentNotice, routeur unique.
      - name: Verifie les invariants de l'etape 2
        run: dart run tool/verifier_jetons.dart

      # Branchement (directeur, 01/11/2026, DECISION-BRANCHEMENT-2026-11-01.md) :
      # aucun fichier de lib/ sans chemin depuis lib/main.dart, hors
      # tool/branchement_tolere.txt, qui ne fait que retrecir. Dart pur.
      - name: Verifie que tout le code de lib/ est branche
        if: matrix.target == 'web'
        run: dart run tool/verifier_branchement.dart

      # Revue directeur 01-02/10/2026 (K-54 a K-59) : cartes collees, bouton
      # recompose, libelle ambigu, mot interne, erreur sans action. Le socle
      # (tool/revue_socle.txt) fige l'existant ; il ne peut que diminuer.
      - name: Verifie les regles de la revue du directeur
        if: matrix.target == 'web'
        run: >-
          dart run tool/verifier_revue.dart --detail
          --regle=cartes-collees,bouton-recompose,libelle-ambigu,mot-interne,erreur-sans-action

      - run: flutter build ${{ matrix.target }}
