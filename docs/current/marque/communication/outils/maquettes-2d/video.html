<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
const L=document.getElementById('trait').getTotalLength();
gsap.set('#trait',{strokeDasharray:L,strokeDashoffset:L});
const tl=gsap.timeline({paused:true});
tl.to('#trait',{strokeDashoffset:0,duration:1.4,ease:'power2.inOut'},0.2)
  .to('#remplir',{attr:{transform:'translate(0 0)'},duration:1.6,ease:'power3.out'},1.2)
  .to('#halo',{opacity:1,duration:1.8,ease:'sine.out'},1.4)
  .to('#porte',{opacity:1,duration:.8,ease:'power1.out'},2.4)
  .to('#sig',{opacity:1,y:0,duration:.9,ease:'power3.out'},3.1)
  .to('.l',{opacity:1,y:0,duration:.7,ease:'power3.out',stagger:.55},4.0)
  .to('#logo',{opacity:1,duration:.8,ease:'power1.out'},6.3);
window.tl=tl;
</script></body></html>
