name: rewayah_academy
description: "Rewayah Academy : gestion des cours de Coran en visio."
publish_to: 'none'

version: 0.2.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Etat et navigation
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1

  # Backend
  supabase_flutter: ^2.17.2

  # Cache local (etape-2-core-flutter.md, section 4)
  drift: ^2.34.4
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^11.0.0
  flutter_cache_manager: ^3.4.2

  # Les icones Phosphor sont integrees en assets, pas en dependance : le paquet
  # phosphor_flutter 2.1.0 ne compile plus avec Flutter 3.47 (IconData y est
  # devenue une classe `final`, il ne peut plus l'etendre) et aucune version
  # corrigee n'existe. Voir docs/archive/2026-09-pre-remise-a-plat/architecture/etape-2-journal.md.

  # Internationalisation, cles en points (section 5)
  slang: ^4.19.1
  slang_flutter: ^4.19.0

  # Libelles audio du composant AudioLabel
  just_audio: ^0.10.6

  # Bandeau de degradation reseau
  connectivity_plus: ^7.3.1

  # Cles d'idempotence de la file de synchronisation
  uuid: ^4.6.0

  # Glyphes du chrome interne de Flutter uniquement. L'iconographie de
  # l'application reste Phosphor : voir la note sous `flutter:` plus bas.
  cupertino_icons: ^1.0.9
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  file_picker: ^12.2.0
  adhan: ^2.0.0+1
  livekit_client: ^2.12.0

  # Supervision (etape 0.6, onboarding etape F). VOLONTAIREMENT BLOQUE EN 8.x :
  # toute version 9.x epingle `jni` a une version exacte (0.14.1 puis 0.14.2),
  # ce qui force `path_provider_android` de 2.3.1 a 2.2.23 et `package_config`
  # de 3.0.0 a 2.2.0. `path_provider_android` porte le repertoire du cache
  # Drift, donc le mode hors ligne, qui est un invariant produit ; la telemetrie
  # n'en est pas un. On ne retrograde pas le second pour le premier. La 8.14.2
  # n'a aucune dependance `jni` et n'entraine aucune retrogradation.
  # A rouvrir le jour ou Sentry relache ce pin (c'est leur pubspec, pas le
  # notre) : `flutter pub add "sentry_flutter:^9"` et verifier `pub get`.
  sentry_flutter: ^8.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.9.1
  drift_dev: ^2.34.4
  riverpod_generator: ^4.0.7
  slang_build_runner: ^4.19.0

flutter:
  # Les glyphes Material servent uniquement au chrome interne du framework :
  # fleche de retour d'AppBar, affordances de TextField. L'iconographie DE
  # L'APPLICATION reste Phosphor et rien d'autre (design-tokens.md section 3),
  # et c'est `tool/verifier_jetons.dart` qui tient cette regle en refusant tout
  # `Icons.` hors de AppIcons. Priver le framework de ses glyphes ne les
  # remplacerait pas : cela afficherait des carres vides.
  # L'elagage d'icones ne garde que les points de code reellement atteints.
  uses-material-design: true

  # assets/i18n n'est pas declare ici : slang compile les chaines dans
  # lib/core/i18n/strings.g.dart, elles ne sont pas lues au reseau ni au disque.
  # Seuls les libelles audio sont de vrais assets d'execution.
  assets:
    - assets/audio/fr/

  # Quatre familles de texte, pas une de plus : deux arabes, deux francaises
  # (decision du coordinateur du 24/09/2026, chantier Tuteur V1), plus les deux
  # graisses d'icones Phosphor. La liste est fermee et verifiee par
  # test/theme/typographie_test.dart.
  # Fichiers versionnes dans le depot : aucune police n'est chargee au reseau,
  # sinon le budget de demarrage a froid et le mode hors ligne tombent.
  fonts:
    # Arabe, documents : Coran, hadiths, livres, lettres.
    - family: UthmanTahaNaskh
      fonts:
        - asset: assets/fonts/UthmanTahaNaskh-Regular.otf

    # Arabe, interface : RTL, menus, boutons, labels.
    # Police variable : la graisse se pilote par FontVariation dans AppTypography.
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Variable.ttf

    # Francais, corps : texte, libelles, navigation, boutons, champs, legendes,
    # statuts, et tous les chiffres (horaires, codes, PIN, chronometre).
    # Plus Jakarta Sans, police variable. Table `fvar` relue sur le binaire le
    # 24/09/2026 : un seul axe, wght 200 a 800 (defaut 400). Fonction `tnum`
    # presente dans la table GSUB : c'est la seule famille francaise qui sait
    # aligner des chiffres en colonne. Licence OFL, voir
    # assets/fonts/LICENSE-PlusJakartaSans.txt.
    # L'italique est un fichier separe, non embarque : aucun style du produit
    # ne le demande.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf

    # Francais, titres : headline* et title* (page, section, carte).
    # DM Sans, police variable. Table `fvar` relue sur le binaire le 24/09/2026 :
    # opsz 9 a 40 (defaut 9), wght 100 a 1000 (defaut 400). Le defaut d'opsz
    # est un piege : un titre qui ne pose pas l'axe sort avec le dessin prevu
    # pour 9 points, plus large et plus lache. AppTypography pose wght ET opsz
    # dans chaque style DM Sans. **Aucune fonction `tnum`** dans la table GSUB :
    # jamais de chiffre de colonne ou de minuteur en DM Sans. Licence OFL, voir
    # assets/fonts/LICENSE-DMSans.txt.
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Variable.ttf

    # Icones Phosphor, deux graisses seulement : `regular` par defaut, `fill`
    # pour les etats actifs (design-tokens.md section 3). Les quatre autres
    # graisses du jeu ne sont pas embarquees. Licence MIT, voir
    # assets/fonts/LICENSE-Phosphor.txt.
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/Phosphor-Fill.ttf
