<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Le chemin de base est remplace par la valeur de --base-href passee a
    `flutter build web`. Il doit commencer et finir par une barre oblique.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    Sans cette ligne, Safari sur iPad rend la page dans une fenetre virtuelle de
    980 px et l'application arrive miniaturisee : c'est la premiere chose qui se
    voit sur une tablette. `viewport-fit=cover` rend l'encoche au SafeArea, que
    l'application pose deja sur chaque ecran.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description" content="Cours de Coran en visio, avec un enseignant attitre pour chaque eleve.">

  <!-- La couleur de l'accent, celle de app_palette.dart, pas celle du gabarit. -->
  <meta name="theme-color" content="#8652E6">

  <!-- Ajout a l'ecran d'accueil, iOS et Android. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Le fond de l'application est clair : la barre d'etat reste en encre sombre. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Rewayah">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Rewayah Academy</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Le fond du document porte la meme couleur que le fond de l'application,
      le creme surfaceCanvas. Sans lui, le temps de chargement s'affiche en
      blanc puis bascule : un clignotement qui se voit surtout au demarrage a
      froid, celui-la meme que le scenario 7 cherche a mesurer.
      Cette valeur suit surfaceCanvas de docs/produit/design-tokens.md, comme
      background_color de web/manifest.json. Les trois changent ensemble.
    */
    html, body { margin: 0; padding: 0; background-color: #F8F4EE; }
  </style>
</head>
<body>
  <!--
    CLAVIER-ENTREE-1 : une langue du navigateur mal formee arretait
    l'application avant le premier ecran. Chromium sans LANG annonce
    « en-US@posix » ; le moteur Web de Flutter passe chaque langue a
    Intl.Locale, qui la refuse (RangeError: Incorrect locale information
    provided), hors de portee du code Dart. Les langues sont donc normalisees
    ICI, avant le moteur : forme POSIX ramenee a BCP 47 (codage « .UTF-8 » et
    modificateur « @posix » retires, « _ » devient « - »), etiquette illisible
    ecartee, liste vide remplacee par le francais. Lecture a chaque appel,
    pour qu'un changement de langue (evenement languagechange) soit normalise
    lui aussi. Seconde barriere cote Dart : lib/core/i18n/langue_demarrage.dart.
  -->
  <script>
    (function () {
      function normaliser(etiquette) {
        if (typeof etiquette !== 'string') return null;
        var brute = etiquette.trim().split('@')[0].split('.')[0].replace(/_/g, '-');
        if (!brute) return null;
        try {
          return new Intl.Locale(brute).toString();
        } catch (e) {
          return null;
        }
      }
      function lire(nom) {
        var d = Object.getOwnPropertyDescriptor(Navigator.prototype, nom);
        return d && d.get ? d.get.call(navigator) : undefined;
      }
      function langues() {
        var brutes = lire('languages');
        if (!brutes || !brutes.length) brutes = [lire('language')];
        var propres = [];
        for (var i = 0; i < brutes.length; i++) {
          var p = normaliser(brutes[i]);
          if (p && propres.indexOf(p) < 0) propres.push(p);
        }
        return propres.length ? propres : ['fr'];
      }
      try {
        Object.defineProperty(navigator, 'languages', {
          configurable: true,
          get: function () { return Object.freeze(langues()); }
        });
        Object.defineProperty(navigator, 'language', {
          configurable: true,
          get: function () { return langues()[0]; }
        });
      } catch (e) {
        // Navigateur qui refuse la redefinition : il garde ses langues.
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
